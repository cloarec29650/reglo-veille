# Veille marché Reglo (QHSE / RSE) : configuration.
# Tout ce qui relève de l'analyse (thèmes, concurrents, cibles, hypothèses de prix)
# est un choix de l'équipe : à relire, compléter et justifier.

http:
  # Identifie le robot auprès des sites (bonne pratique). Ajouter un contact.
  user_agent: "RegloVeille/0.2 (projet étudiant MyDigitalSchool; contact: a-completer)"
  timeout_s: 20
  # Délai minimal entre deux requêtes vers un même domaine.
  min_delay_s: 1.5

# ─────────────────────────────── Presse & tendances ───────────────────────────────
press:
  # Âge maximal d'un article conservé (les recherches Bing remontent parfois des articles anciens).
  max_age_days: 120
  # Longueur max du résumé conservé (extrait, pas l'article : droit voisin).
  snippet_chars: 280

  # Flux RSS publics, robots.txt vérifié. type : presse | spécialisé | institutionnel | concurrent
  # Écartés : Google News (robots.txt interdit /rss/search), Éditions Tissot, Préventique (403 aux robots),
  # GDELT (limite de débit trop stricte pour une collecte fiable).
  feeds:
    - { name: ANACT, url: "https://www.anact.fr/rss.xml", type: institutionnel }
    - { name: CNIL, url: "https://www.cnil.fr/fr/rss.xml", type: institutionnel }
    - { name: "Actu-Environnement (risques)", url: "https://www.actu-environnement.com/flux/rss/risques/", type: spécialisé }
    - { name: "Actu-Environnement (déchets)", url: "https://www.actu-environnement.com/flux/rss/dechets/", type: spécialisé }
    - { name: "Actu-Environnement (énergie)", url: "https://www.actu-environnement.com/flux/rss/energie/", type: spécialisé }
    - { name: Qualiblog, url: "https://www.qualiblog.fr/feed/", type: spécialisé }
    - { name: Novethic, url: "https://www.novethic.fr/feed", type: presse }
    - { name: "L'Info Durable", url: "https://www.linfodurable.fr/rss.xml", type: presse }
    - { name: "L'Usine Nouvelle", url: "https://www.usinenouvelle.com/rss/", type: presse }
    - { name: Maddyness, url: "https://www.maddyness.com/feed/", type: presse }
    - { name: FrenchWeb, url: "https://www.frenchweb.fr/feed", type: presse }
    - { name: "Blog BlueKanGo", url: "https://www.bluekango.com/feed/", type: concurrent }
    - { name: "Blog Preventeo", url: "https://www.preventeo.com/fr/feed/", type: concurrent }
    - { name: "Blog Utopies", url: "https://utopies.com/feed/", type: concurrent }
    - { name: "Blog Agence Déclic", url: "https://www.agence-declic.fr/feed/rss/", type: concurrent }

  # Recherches d'actualité Bing News (flux RSS public, autorisé par robots.txt).
  # Requêtes métier précises : c'est ici qu'on « creuse ». Les concurrents sont ajoutés automatiquement.
  bing_queries:
    - '"document unique" DUERP'
    - '"évaluation des risques professionnels"'
    - '"faute inexcusable" employeur'
    - '"inspection du travail" entreprise sanction'
    - '"risques psychosociaux" entreprise'
    - 'QVCT "qualité de vie et des conditions de travail"'
    - '"maladie professionnelle" reconnaissance'
    - '"taux AT/MP" OR "cotisation AT/MP"'
    - 'pénibilité "C2P" OR "compte professionnel de prévention"'
    - '"ISO 45001" certification'
    - '"ISO 14001" certification'
    - '"ISO 9001:2026" OR "ISO 9001 2026"'
    - 'VSME PME'
    - 'CSRD Omnibus PME'
    - '"devoir de vigilance" entreprise'
    - '"bilan carbone" OR BEGES obligation entreprise'
    - '"décret tertiaire"'
    - 'ICPE Seveso exploitant'
    - '"logiciel QHSE"'
    - '"logiciel HSE" OR "logiciel RSE"'
    - '"veille réglementaire" HSE OR QHSE'
    - 'EcoVadis notation fournisseurs'
    # Textes français (en attendant l'API Légifrance) : décrets et arrêtés commentés par la presse.
    - '"Journal officiel" décret "santé et sécurité au travail"'
    - '"Journal officiel" arrêté prévention "risques professionnels"'
    - '"Journal officiel" décret ICPE OR "installations classées"'
    - '"Journal officiel" décret reporting durabilité OR CSRD'

# ─────────────────────────────── Classement ───────────────────────────────
# Texte normalisé (minuscules, sans accents), mots entiers. Score = 2 points par mot-clé distinct
# d'un thème « coeur », 1 point sinon, 3 points par concurrent cité.
relevance:
  # Un article doit atteindre ce score (évite les articles « vitrine » qui citent un seul mot générique).
  min_score: 4
  # Résultats de recherche Bing : la requête est déjà ciblée, un mot-clé métier dans l'article suffit.
  search_min_score: 2
  # Âge maximal des articles trouvés en cherchant le nom d'un concurrent (signal plus rare, plus durable).
  competitor_max_age_days: 365
  # Écarter les articles en anglais.
  french_only: true

themes:
  sst_prevention:
    label: "Santé, sécurité & prévention"
    core: true
    keywords: [duerp, "document unique", "evaluation des risques", "accident du travail", "accidents du travail",
               "maladie professionnelle", "maladies professionnelles", "at/mp", "taux at/mp", "faute inexcusable",
               "inspection du travail", "risques psychosociaux", rps, "troubles musculosquelettiques", tms, penibilite,
               c2p, "plan de prevention", "permis feu", "protocole de securite", epi, "equipements de protection",
               "sante au travail", "securite au travail", "service de prevention", inrs, carsat, anact, qvct,
               "conditions de travail", "medecine du travail", "travailleur isole", "risque chimique", "amiante"]
  reglementation:
    label: "Réglementation & conformité"
    core: true
    keywords: [decret, arrete, "journal officiel", "entre en vigueur", "entree en vigueur", "projet de loi",
               "proposition de loi", directive, "reglement europeen", "reglement (ue)", transposition, "mise en demeure",
               sanction, "obligation reglementaire", conformite, "veille reglementaire", "code du travail",
               "code de l'environnement", rgpd, "ai act", "ia act"]
  reporting_durabilite:
    label: "CSRD, VSME & reporting durabilité"
    core: true
    keywords: [csrd, vsme, esrs, efrag, omnibus, "rapport de durabilite", "double materialite", "reporting extra-financier",
               "taxonomie", "devoir de vigilance", cs3d, csddd, "declaration de performance extra-financiere", dpef]
  normes_certification:
    label: "Normes, certifications & labels"
    core: true
    keywords: [qhse, hse, qse, "iso 9001", "iso 14001", "iso 45001", "iso 50001", "iso 26000", mase, "systeme de management",
               "audit interne", certification, ecovadis, "label rse", "b corp", "societe a mission", afnor]
  environnement_risques:
    label: "Environnement & risques industriels"
    core: true
    keywords: [icpe, seveso, "bilan carbone", "bilan ges", beges, "scope 3", decarbonation, "decret tertiaire",
               "responsabilite elargie du producteur", rep, "dechets dangereux", "affichage environnemental",
               "risque industriel", reach, "fiche de donnees de securite", fds, pfas]
  solutions_marche:
    label: "Solutions & acteurs du marché"
    core: true
    keywords: ["logiciel qhse", "logiciel hse", "logiciel rse", "logiciel qse", "plateforme rse", "solution saas",
               "editeur de logiciel", "veille reglementaire", "levee de fonds", "leve des fonds", rachat, acquisition,
               "rachete", "acquiert"]
  contexte:
    label: "Contexte (RSE, ESG, numérique)"
    core: false
    keywords: [rse, esg, "responsabilite societale", digitalisation, saas, "intelligence artificielle", startup, pme, eti]

# ─────────────────────────────── Concurrents ───────────────────────────────
# Liste indicative à valider par l'équipe (mapping concurrentiel).
# urls : pages suivies (ajouter les pages tarifs) ; aliases : noms détectés dans la presse ;
# siren : annonces légales BODACC (comptes, modifications, cessions, radiations). À vérifier.
# ambiguous : nom courant (homonymes) → mention retenue seulement avec un thème métier, et recherche précisée (search).
competitors:
  # ── Concurrents identifiés par l'équipe (dossier « Le projet », état des lieux de la concurrence) ──
  - { name: ZEI, category: "Plateforme RSE / impact", urls: ["https://zei-world.com"], aliases: ["zei"], siren: "814080552", ambiguous: true, search: 'ZEI RSE OR impact OR plateforme' }
  - { name: ORKI, category: "Logiciel ESG / RSE", urls: ["https://orki.green"], aliases: ["orki"], siren: "949104533", ambiguous: true, search: 'ORKI ESG OR RSE OR logiciel' }
  - { name: Goodwill Management, category: "Conseil RSE / baromètres", urls: ["https://goodwill-management.com"], aliases: ["goodwill management", "goodwill-management"], siren: "450482641" }
  - { name: Ecolearn, category: "Formation RSE certifiante", urls: [], aliases: ["ecolearn"], siren: "880916986", ambiguous: true, search: 'Ecolearn formation RSE' }
  - { name: EcoVadis, category: "Notation RSE", urls: ["https://ecovadis.com"], aliases: [ecovadis], siren: "497842914" }
  - { name: Utopies, category: "Conseil RSE / stratégie durable", urls: ["https://utopies.com"], aliases: ["utopies"], siren: "393608518", ambiguous: true, search: 'Utopies RSE OR "développement durable" agence' }
  - { name: Agence Déclic, category: "Conseil RSE", urls: ["https://www.agence-declic.fr"], aliases: ["agence declic", "agence déclic"], siren: "808200224" }
  # ── Ajouts data, à valider en équipe : éditeurs QHSE / veille réglementaire / carbone ──
  - { name: Red-on-line, category: "Veille réglementaire HSE (ajout data)", urls: ["https://www.red-on-line.com"], aliases: ["red-on-line", "red on line"], siren: "425043064" }
  - { name: Preventeo, category: "Veille réglementaire HSE (ajout data)", urls: ["https://www.preventeo.com"], aliases: [preventeo], siren: "478822653" }
  - { name: Tennaxia, category: "Logiciel HSE / RSE (ajout data)", urls: ["https://www.tennaxia.com"], aliases: [tennaxia], siren: "435305636" }
  - { name: BlueKanGo, category: "Logiciel QHSE (ajout data)", urls: ["https://www.bluekango.com"], aliases: [bluekango], siren: "420710097" }
  - { name: Ennov, category: "Logiciel qualité (ajout data)", urls: ["https://www.ennov.com"], aliases: [ennov], siren: "428692701" }
  - { name: Qualios, category: "Logiciel qualité (ajout data)", urls: ["https://www.qualios.com"], aliases: [qualios], siren: "451953319" }
  - { name: Qontinua, category: "Logiciel QHSE / RSE (ajout data)", urls: [], aliases: [qontinua], siren: "931554729" }
  - { name: Greenly, category: "Plateforme carbone (ajout data)", urls: ["https://www.greenly.earth"], aliases: [greenly], ambiguous: true, search: 'Greenly carbone OR ACV OR climat' }
  - { name: Sweep, category: "Plateforme ESG / carbone (ajout data)", urls: ["https://www.sweep.net"], aliases: ["sweep"], siren: "883967879", ambiguous: true, search: 'Sweep carbone OR ESG OR CSRD' }

companies:
  bodacc_url: "https://bodacc-datadila.opendatasoft.com/api/explore/v2.1/catalog/datasets/annonces-commerciales/records"
  lookback_days: 365

# ─────────────────────────────── Réglementation officielle ───────────────────────────────
regulation:
  # EUR-Lex via le point d'accès SPARQL public de l'Office des publications (Cellar).
  # Seuls les actes législatifs (CELEX 3…) et les propositions / travaux préparatoires (CELEX 5…).
  sparql_url: "https://publications.europa.eu/webapi/rdf/sparql"
  lookback_days: 120
  # Expressions recherchées dans le titre français (expressions régulières, insensibles à la casse).
  title_patterns:
    - "durabilité"
    - "devoir de vigilance"
    - "santé et (de la )?sécurité"
    - "sécurité et (de la )?santé"
    - "agents (chimiques|cancérigènes|mutagènes)"
    - "équipements de protection individuelle"
    - "taxonomie"
    - "écoconception"
    - "allégations environnementales"
    - "gaz à effet de serre"
    - "substances chimiques|REACH"
    - "emballages et (aux )?déchets"
    - "machines"
    - "omnibus"
    # Textes de référence : tout acte qui les modifie ou les complète est retenu.
    - "2023/2772"          # normes ESRS
    - "2013/34/UE"         # directive comptable, socle de la CSRD
    - "2022/2464"          # CSRD
    - "2024/1760"          # devoir de vigilance européen (CS3D)
    - "1907/2006"          # REACH
    - "89/391/CEE"         # directive-cadre santé et sécurité au travail
  # Titres écartés (bruit : rectificatifs, secteurs hors cible).
  title_exclude:
    - "rectificatif|rectifiant|versions linguistiques"
    - "exploitations agricoles|protéines|pêche|vitivinicole|denrées alimentaires|médicament"
    - "réception par type|véhicules|aéronefs?|rescEU|protection civile"

# ─────────────────────────────── Indicateurs marché ───────────────────────────────
market:
  # Open data Assurance Maladie (régime général) : entreprises et salariés par taille et secteur.
  ameli_base: "https://data.ameli.fr/api/explore/v2.1/catalog/datasets"
  # Tranches d'effectif ciblées (ordre_taille_entreprise) : 1 <10, 2 10-19, 3 20-49,
  # 4 50-149, 5 150-199, 6 200-499, 7 500+. Choix de cible à justifier.
  target_size_orders: [2, 3, 4, 5, 6]
  # Hypothèses de prix annuel (€ HT) par tranche, pour estimer le marché adressable.
  # Laisser null tant que la grille tarifaire n'est pas décidée.
  annual_price_by_size_order: { 2: null, 3: null, 4: null, 5: null, 6: null }

tenders:
  # BOAMP (open data DILA) : avis contenant un de ces termes dans l'objet.
  boamp_url: "https://boamp-datadila.opendatasoft.com/api/explore/v2.1/catalog/datasets/boamp/records"
  lookback_days: 90
  # Recentré sur ce que Reglo vend (logiciel, veille, formation, DUERP, RSE) : pas de missions de chantier (SPS).
  keywords: ["QHSE", "logiciel HSE", "logiciel QHSE", "logiciel RSE", "veille réglementaire", "document unique", "DUERP",
             "risques psychosociaux", "formation sécurité", "formation santé et sécurité", "formation prévention",
             "bilan carbone", "bilan GES", "RSE", "CSRD", "ISO 45001", "ISO 14001"]

jobs:
  # API Offres d'emploi France Travail (inscription gratuite sur francetravail.io).
  # Activée seulement si FT_CLIENT_ID et FT_CLIENT_SECRET sont définis dans l'environnement.
  keywords: ["QHSE", "HSE", "RSE", "responsable sécurité"]

# ─────────────────────────────── Sinistralité AT/MP ───────────────────────────────
atmp:
  dataset: "sinistralite-par-secteur-d-activite-concerne-naf-1"
  top_sectors: 8
